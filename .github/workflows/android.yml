name: Android Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages (without leading v, e.g. 1.8.1)"
        required: false
        default: "1.8.1"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-prod-release:
    name: Build Android & Wear OS APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="1.8.1"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Android version: $version"

      - name: Setup Secrets (Keystore & local.properties)
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret KEYSTORE_BASE64"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret provided; generating self-signed release keystore for CI"
            keytool -genkeypair -v -keystore release.jks -alias mumixic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mumixicpassword -keypass mumixicpassword \
              -dname "CN=Mumixic, OU=Mobile, O=Mumixic, L=City, ST=State, C=US"
            {
              echo "storeFile=release.jks"
              echo "storePassword=mumixicpassword"
              echo "keyAlias=mumixic"
              echo "keyPassword=mumixicpassword"
            } > keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Prod Release APKs
        run: ./gradlew assembleProdRelease -Pmumixic.version=${{ steps.version.outputs.value }}

      - name: Collect and Name APKs for OTA
        shell: bash
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist

          find_and_copy() {
            local search_dir="$1"
            local pattern="$2"
            local target_name="$3"
            if [ -d "$search_dir" ]; then
              local match
              match=$(find "$search_dir" -maxdepth 1 -name "$pattern" 2>/dev/null | head -n 1)
              if [ -n "$match" ] && [ -f "$match" ]; then
                cp "$match" "dist/$target_name"
                echo "Copied $match -> dist/$target_name"
              fi
            fi
          }

          # 1. Phone universal APK
          find_and_copy "app/build/outputs/apk/prod/release" "*universal*.apk" "Mumixic-v$v.apk"
          find_and_copy "app/build/outputs/apk/prod/release" "*universal*.apk" "Mumixic-$v.apk"

          # 2. Phone ABI split APKs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            find_and_copy "app/build/outputs/apk/prod/release" "*$abi*.apk" "Mumixic-v${v}_${abi}.apk"
            find_and_copy "app/build/outputs/apk/prod/release" "*$abi*.apk" "Mumixic-${v}_${abi}.apk"
          done

          # Fallback if no universal was matched
          if [ ! -f "dist/Mumixic-v$v.apk" ]; then
            find_and_copy "app/build/outputs/apk/prod/release" "*.apk" "Mumixic-v$v.apk"
            find_and_copy "app/build/outputs/apk/prod/release" "*.apk" "Mumixic-$v.apk"
          fi

          # 3. TV universal APK
          find_and_copy "tv/build/outputs/apk/prod/release" "*universal*.apk" "MumixicTV-v$v.apk"
          find_and_copy "tv/build/outputs/apk/prod/release" "*universal*.apk" "MumixicTV-$v.apk"

          # 4. TV ABI split APKs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            find_and_copy "tv/build/outputs/apk/prod/release" "*$abi*.apk" "MumixicTV-v${v}_${abi}.apk"
            find_and_copy "tv/build/outputs/apk/prod/release" "*$abi*.apk" "MumixicTV-${v}_${abi}.apk"
          done

          # Fallback if no TV universal was matched
          if [ ! -f "dist/MumixicTV-v$v.apk" ]; then
            find_and_copy "tv/build/outputs/apk/prod/release" "*.apk" "MumixicTV-v$v.apk"
            find_and_copy "tv/build/outputs/apk/prod/release" "*.apk" "MumixicTV-$v.apk"
          fi

          # 5. Wear OS APK (if available)
          find_and_copy "wearos/build/outputs/apk/prod/release" "*.apk" "Mumixic-WearOS-v$v.apk"
          find_and_copy "wearos/build/outputs/apk/prod/release" "*.apk" "Mumixic-WearOS-$v.apk"

          echo "Collected APKs for OTA release:"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mumixic-Android-APKs
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: Mumixic v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          files: dist/*
          body: |
            ## What's New in Mumixic v${{ steps.version.outputs.value }}

            ### 🔍 Liquid Glass Navigation & Search Polish
            - **In-Place Expandable Search Bar**: Tapping the search button in Liquid Glass mode expands smoothly into a floating glass search bar without navigating away from the current view.
            - **Soft Keyboard Alignment**: Configured `adjustResize` and reactive `glassBarInsets` so the floating search bar sits gracefully above the soft keyboard without clipping.
            - **Seamless Dismissal**: System back gestures and the search close button cleanly collapse search back to the navigation bar.

            ### 🎨 Settings & Branding Polish
            - **Quick Appearance Access**: Moved the **Liquid Glass** toggle directly into the main **Settings** page under **Appearance**.
            - **Emblem Branding**: Positioned the clean Mumixic mark icon at the top-left opposite the profile avatar (clean emblem, no text).
            - **Streamlined Pivot Headers**: Cleaned up the header layout by removing redundant page titles above Windows Phone pivot tabs.

            ### ✨ Micro-Interactions & Liquid Motion
            - **Play/Pause Morph**: Fluid SVG path morphing between the Play triangle and Pause bars with natural spring bounce physics.
            - **3D Parallax Tilt**: Album artwork dynamically tilts in 3D perspective (`rotationY`, `rotationZ`, and perspective `cameraDistance`) in response to horizontal gestures and swipes.
            - **Heart / Favorite Burst**: Tapping favorite triggers a tactile bounce accompanied by a 12-particle colorful radial spark explosion.

            ### 🎵 Audio Quality Typography
            - Replaced bulky pill badges with a clean, unobtrusive typographic indicator directly below artist credits (`Hi-Res Lossless`, `Lossless`, `High Quality · 320 kbps`).

            ### 📺 TV & Platform Optimizations
            - Synchronized versioning across phone (`1.8.1`), TV (`1.8.1`), and CI builds.
            - Automated TV APK artifact packaging (`MumixicTV-1.8.1.apk` and ABI splits) for seamless in-app OTA updates.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
