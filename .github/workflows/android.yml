name: Android Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages (without leading v, e.g. 1.8.0)"
        required: false
        default: "1.8.0"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-prod-release:
    name: Build Android & Wear OS APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="1.8.0"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Android version: $version"

      - name: Setup Secrets (Keystore & local.properties)
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret KEYSTORE_BASE64"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret provided; generating self-signed release keystore for CI"
            keytool -genkeypair -v -keystore release.jks -alias mumixic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mumixicpassword -keypass mumixicpassword \
              -dname "CN=Mumixic, OU=Mobile, O=Mumixic, L=City, ST=State, C=US"
            {
              echo "storeFile=release.jks"
              echo "storePassword=mumixicpassword"
              echo "keyAlias=mumixic"
              echo "keyPassword=mumixicpassword"
            } > keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Prod Release APKs
        run: ./gradlew assembleProdRelease -Pmumixic.version=${{ steps.version.outputs.value }}

      - name: Collect and Name APKs for OTA
        shell: bash
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist

          # 1. Universal phone APK (preferred for OTA)
          universal_apk=$(ls app/build/outputs/apk/prod/release/*universal*.apk 2>/dev/null | head -n 1)
          if [ -f "$universal_apk" ]; then
            cp "$universal_apk" "dist/Mumixic-$v.apk"
          fi

          # 2. ABI-specific split APKs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            abi_apk=$(ls app/build/outputs/apk/prod/release/*"$abi"*.apk 2>/dev/null | head -n 1)
            if [ -f "$abi_apk" ]; then
              cp "$abi_apk" "dist/Mumixic-${v}_${abi}.apk"
            fi
          done

          # 3. Fallback single APK if no universal name matched
          if [ ! -f "dist/Mumixic-$v.apk" ]; then
            single_apk=$(ls app/build/outputs/apk/prod/release/*.apk 2>/dev/null | head -n 1)
            if [ -f "$single_apk" ]; then
              cp "$single_apk" "dist/Mumixic-$v.apk"
            fi
          fi

          # 4. Wear OS APK
          wear_apk=$(ls wearos/build/outputs/apk/prod/release/*.apk 2>/dev/null | head -n 1)
          if [ -f "$wear_apk" ]; then
            cp "$wear_apk" "dist/Mumixic-WearOS-$v.apk"
          fi

          echo "Collected APKs for OTA release:"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mumixic-Android-APKs
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: Mumixic v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
